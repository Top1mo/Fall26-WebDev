<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iOS Calculator - CSE343 Lab 3</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="calculator-wrapper">
        <section class="calculator" aria-label="iOS Calculator">
            <!-- Header -->
            <div class="calculator-header">
                <span class="calc-title">iOS Calculator</span>
            </div>

            <!-- Display Screen -->
            <div class="display-container">
                <div class="previous-operand" id="previous-operand"></div>
                <div class="current-operand" id="display">0</div>
            </div>

            <!-- Keypad (Event Delegation Target) -->
            <div class="keypad" id="keypad">
                <!-- Row 1 -->
                <button type="button" class="btn btn-secondary" data-action="clear" aria-label="All Clear">AC</button>
                <button type="button" class="btn btn-secondary" data-action="double-zero" aria-label="Double Zero">00</button>
                <button type="button" class="btn btn-secondary" data-action="percent" aria-label="Percentage">%</button>
                <button type="button" class="btn btn-operator" data-action="operator" data-operator="÷" aria-label="Divide">&divide;</button>

                <!-- Row 2 -->
                <button type="button" class="btn btn-number" data-number="7">7</button>
                <button type="button" class="btn btn-number" data-number="8">8</button>
                <button type="button" class="btn btn-number" data-number="9">9</button>
                <button type="button" class="btn btn-operator" data-action="operator" data-operator="&times;" aria-label="Multiply">&times;</button>

                <!-- Row 3 -->
                <button type="button" class="btn btn-number" data-number="4">4</button>
                <button type="button" class="btn btn-number" data-number="5">5</button>
                <button type="button" class="btn btn-number" data-number="6">6</button>
                <button type="button" class="btn btn-operator" data-action="operator" data-operator="-" aria-label="Subtract">&minus;</button>

                <!-- Row 4 -->
                <button type="button" class="btn btn-number" data-number="1">1</button>
                <button type="button" class="btn btn-number" data-number="2">2</button>
                <button type="button" class="btn btn-number" data-number="3">3</button>
                <button type="button" class="btn btn-operator" data-action="operator" data-operator="+" aria-label="Add">+</button>

                <!-- Row 5 -->
                <button type="button" class="btn btn-number btn-zero" data-number="0">0</button>
                <button type="button" class="btn btn-number" data-action="decimal">.</button>
                <button type="button" class="btn btn-operator" data-action="calculate" aria-label="Equals">=</button>
            </div>
        </section>
    </main>

    <!-- JavaScript Script added at end of body as taught in Lab 3 -->
    <script src="script.js"></script>
</body>
</html>
